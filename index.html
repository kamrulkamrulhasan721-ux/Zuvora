<!DOCTYPE html>
<html>
<head>
    <title>Zuvora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Zuvora</h1>
</header>

<div class="profile">

<div class="cover-banner"></div>

<img src="https://i.pravatar.cc/150?img=3"
class="profile-pic"
id="profilePic">

<input type="file"
id="profileImageInput"
accept="image/*">

  <h2>
    <span id="username">Kamrul</span>
    <span class="gold-verified">✓</span>
</h2>
<p id="userHandle">@kamrul</p>
<p id="userBio">🚀 Building Zuvora</p>
<p id="userLocation">🌍 Bangladesh</p>
<div class="highlights">
    <div class="highlight">👤 Me</div>
    <div class="highlight">👥 Friends</div>
    <div class="highlight">✈️ Travel</div>
    <div class="highlight">🎵 Music</div>
    <div class="highlight">⭐ Moments</div>
</div>
<div class="stats">
    <div>
        <h3 id="postCount">0</h3>
        <p>Posts</p>
    </div>

        <div>
          <h3 id="followersCount">500</h3>
<p>Followers</p>
            
        </div>

        <div>
            <h3>180</h3>
            <p>Following</p>
        </div>
    </div>

<div class="profile-buttons">
    <button id="followBtn" onclick="alert('Follow works')">Follow</button>
    <button id="editProfileBtn">Edit Profile</button>
    <button id="shareProfileBtn">Share</button>
</div>
</div>
<div class="create-post">

    <select id="mood">
        <option>😄 Happy</option>
        <option>😎 Chill</option>
        <option>🔥 Trending</option>
        <option>💪 Motivated</option>
    </select>

    <input
        type="text"
        id="postInput"
        placeholder="What's happening on Zuvora?"
    >
<input type="file" id="imageInput" accept="image/*">
  
</div>
<button id="postBtn">Post</button>

</div>
<div id="editProfileBox" style="display:none;">

<h3>Edit Profile</h3>

<input type="text" id="editName" placeholder="Name">

<input type="text" id="editUsername" placeholder="Username">

<textarea id="editBio" placeholder="Bio"></textarea>

<input type="text" id="editLocation" placeholder="Location">

<button id="saveProfileBtn">Save</button>
</div>

<div style="width:70px;height:70px;background:purple;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;">👤</div>

    <div class="story">➕</div>

    <div class="story">👤</div>

    <div class="story">🎵</div>

    <div class="story">✈️</div>

    <div class="story">🔥</div>

</div>

<div id="feed">

    <div class="post">
        <h3>@zuvora</h3>
        <p>😄 Happy</p>
        <p>Welcome to Zuvora 🚀</p>
    </div>

</div>

<div class="bottom-nav">
    <button onclick="location.href='index.html'">🏠</button>
    <button onclick="location.href='explore.html'">🔍</button>
    <button onclick="location.href='create-post.html'">➕</button>
   <button onclick="location.href='messages.html'">💬</button>
    <button onclick="location.href='profile.html'">👤</button>
</div>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="firebase-posts.js"></script>
<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html><html>
<head>
    <title>Zuvora Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><header>
    <h1>Zuvora</h1>
</header><div class="profile"><div class="cover-banner"></div>

<label for="profileImageInput">

<img src="https://i.pravatar.cc/150?img=3"
class="profile-pic"
id="profilePic"
onclick="document.getElementById('profileImageInput').click()">

</label>

<input type="file"
id="profileImageInput"
accept="image/*">
<h2>
    <span id="username">Kamrul</span>
    <span class="gold-verified">✓</span>
</h2>

<p id="userHandle">@kamrul</p>

<p id="userBio">🚀 Building Zuvora</p>

<p id="userLocation">🌍 Bangladesh</p>
<div class="stats">

    <div>
        <h3>25</h3>
        <p>Posts</p>
    </div>

    <div>
        <h3>500</h3>
        <p>Followers</p>
    </div>

    <div>
        <h3>180</h3>
        <p>Following</p>
    </div>

</div>

<div class="profile-actions">
    <button id="editProfileBtn">Edit Profile</button>
    <button id="shareProfileBtn">Share Profile</button>
    <button onclick="location.href='settings.html'">⚙️ Settings</button>
</div>
<div id="editProfileBox" style="display:none;">

    <h3>Edit Profile</h3>

    <input type="text" id="editName" placeholder="Name">

    <input type="text" id="editUsername" placeholder="Username">

    <textarea id="editBio" placeholder="Bio"></textarea>

    <input type="text" id="editLocation" placeholder="Location">

    <button id="saveProfileBtn">Save</button>

</div>
</div><div class="story-highlights"><div class="story-item">
    <span>👤</span>
    <p>Me</p>
</div>

<div class="story-item">
    <span>👥</span>
    <p>Friends</p>
</div>

<div class="story-item">
    <span>✈️</span>
    <p>Travel</p>
</div>

<div class="story-item">
    <span>🎵</span>
    <p>Music</p>
</div>

</div><div class="profile-tabs">
    <button>📷 Posts</button>
    <button>🎬 Reels</button>
    <button>❤️ Saved</button>
</div><div class="post-grid"><div class="grid-item"></div>
<div class="grid-item"></div>
<div class="grid-item"></div>

<div class="grid-item"></div>
<div class="grid-item"></div>
<div class="grid-item"></div>

<div class="grid-item"></div>
<div class="grid-item"></div>
<div class="grid-item"></div>

</div><div class="bottom-nav">
    <button onclick="location.href='index.html'">🏠</button>

    <button onclick="location.href='create-post.html'">➕</button>
   <button onclick="location.href='messages.html'">💬</button>
    <button onclick="location.href='profile.html'">👤</button>


<script src="script.js"></script>

</body>
</html>
